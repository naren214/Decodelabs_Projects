name: CI

on:
  push:
    branches: [main, fix/autonomous-maintenance]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  expense-tracker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v
